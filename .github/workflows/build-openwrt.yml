name: Build VT-STREET-M2 OpenWrt 25.12

on:
  workflow_dispatch:
  push:
    branches: [ main, t99w175-autostart-preflight, fix/firmware-hardening-20260913 ]
    paths:
      - 'port/**'
      - 'config/**'
      - 'package/**'
      - 'scripts/**'
      - '.github/workflows/build-openwrt.yml'

permissions:
  contents: read

concurrency:
  group: vt-street-m2-openwrt-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    env:
      # Official OpenWrt openwrt-25.12 commit observed 2026-09-11.
      OPENWRT_COMMIT: 6c40bc0bb0e78c67a1f7d8e6d4b048e78951b932

    steps:
      - name: Checkout VT-STREET-M2 port
        uses: actions/checkout@v4

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget curl time xsltproc ca-certificates busybox nodejs libsqlite3-dev

      - name: Test T99 startup handoff without modem hardware
        run: python3 scripts/test-t99w175-net-ready.py

      - name: Test firmware package validation
        run: python3 scripts/tests/test-vtmodem-root.py

      - name: Test image validation and MAC preservation
        run: |
          python3 scripts/tests/test-vt-image.py
          python3 scripts/tests/test-vt-mac.py
          python3 scripts/tests/test-build-workflow.py

      - name: Fetch pinned OpenWrt 25.12 source
        run: |
          git init openwrt
          git -C openwrt remote add origin https://github.com/openwrt/openwrt.git
          git -C openwrt fetch --depth=1 origin "$OPENWRT_COMMIT"
          git -C openwrt checkout --detach FETCH_HEAD
          echo "OpenWrt source: $(git -C openwrt rev-parse HEAD)"

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-25.12-dl-${{ env.OPENWRT_COMMIT }}
          restore-keys: |
            openwrt-25.12-dl-

      - name: Install immutable feed revisions
        run: |
          cp config/feeds.conf.lock openwrt/feeds.conf
          cd openwrt
          ./scripts/feeds update -a
          python3 ../scripts/build-identity.py --feeds-only "$PWD"
          ./scripts/feeds install -a

      - name: Apply VT-STREET-M2 board port
        run: |
          bash scripts/apply-port.sh "$GITHUB_WORKSPACE/openwrt"
          echo '===== SELECTED CONFIG ====='
          grep -E '^(CONFIG_TARGET_ramips|CONFIG_PACKAGE_(luci|luci-ssl|vtmodem|uqmi|kmod-usb-acm|kmod-usb-net-cdc-ncm|kmod-usb-net-qmi-wwan|kmod-usb-serial-option|kmod-usb3))' openwrt/.config || true

      - name: Download source packages
        working-directory: openwrt
        run: make download -j8

      - name: Build the pinned OpenWrt host ucode runtime
        working-directory: openwrt
        run: |
          # CMake's declared tool dependencies also prepare Ninja, pkgconf,
          # zlib and the archive/patch tools. This does not build target firmware.
          make -j"$(nproc)" tools/cmake/compile V=s
          # Includes libjson-c/host and the patches from OPENWRT_COMMIT.
          make -j"$(nproc)" package/utils/ucode/host/compile V=s

      - name: Test VT Modem web and backend fixtures without hardware
        timeout-minutes: 5
        run: bash scripts/test-vtmodem-web.sh

      - name: Build OpenWrt
        shell: bash
        run: |
          set -o pipefail
          cd openwrt
          if ! make -j"$(nproc)" V=s 2>&1 | tee ../build.log; then
            echo 'Parallel build failed; retrying serially for a deterministic error log.' | tee -a ../build.log
            make -j1 V=s 2>&1 | tee -a ../build.log
          fi

      - name: Collect and validate firmware
        run: |
          bash scripts/collect-and-validate.sh "$GITHUB_WORKSPACE/openwrt" "$GITHUB_WORKSPACE/artifacts"
          echo '===== VALIDATION ====='
          cat artifacts/VALIDATION.txt

      - name: Upload firmware and validation files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vt-street-m2-openwrt-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/**
            build.log
            openwrt/.config
