name: VT Modem fast checks

on:
  pull_request:
    paths:
      - 'package/**'
      - 'port/**'
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vtmodem-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential nodejs python3 busybox libsqlite3-dev
      - name: Test JavaScript, C, shell lifecycle and packaging
        shell: bash
        run: |
          set -euo pipefail
          export TZ=UTC
          for test in scripts/tests/test-*.js; do
            timeout --kill-after=5s 30s node "$test"
          done
          timeout --kill-after=5s 60s python3 scripts/test-t99w175-net-ready.py
          for test in scripts/tests/test-*.py; do
            timeout --kill-after=5s 60s python3 "$test"
          done
          echo VT_MODEM_FAST_CHECKS_OK

      # ucode fixtures remain in build-openwrt.yml, using the interpreter and
      # modules compiled from that exact OpenWrt revision, never a distro substitute.
