name: Apply tested release 21 source patch
on:
  push:
    branches: [ fix/firmware-hardening-20260913 ]
    paths: [ '.github/workflows/apply-release21.yml' ]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'makssbaks/vt-street-m2-openwrt' && github.ref == 'refs/heads/fix/firmware-hardening-20260913'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify immutable patch and apply without changing workflows
        shell: bash
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/release21.patch"
          cat .maintenance/r21/0{1,2,3,4,5,6}.patch > "$patch"
          echo "c1869599b504d760e089176a11993f0aececf08e022e4f346f91434baf1daaf0  $patch" | sha256sum -c -
          git apply --check --index "$patch"
          git apply --index "$patch"
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^.github/'; then
            echo 'STOP: source patch must not modify workflow permissions or contents' >&2
            exit 1
          fi
          python3 scripts/tests/test-vt-stability.py
          python3 scripts/tests/test-vt-runtime.py
          node scripts/tests/test-vtmodem-connection.js
          node scripts/tests/test-vtmodem-sms.js
          git diff --cached --stat
      - name: Commit tested source to the same development branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'VT Modem release 21: safe data-session controls and firmware runtime audit' -m 'Apply SHA256-verified patch tested offline on host and actual MIPS/musl runtime. Add confirmed netifd-only connection controls, strict SMS/radio parsing and target image gates; remove unused QMI client and redundant stock traffic autostart. No QMI lifecycle, USB reset, NAND layout or radio defaults are changed.'
          git push origin HEAD:refs/heads/fix/firmware-hardening-20260913
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
