# Private VT Modem instance. Do not reuse the stock vnstat database or service.
DatabaseDir "/etc/vtmodem/traffic"
Locale "C"
InterfaceMatchMethod 0
UnitMode 2
RateUnit 1
UpdateInterval 10
PollInterval 5
SaveInterval 10
OfflineSaveInterval 10
RescanDatabaseOnSave 1
AlwaysAddNewInterfaces 0
SaveOnStatusChange 1
TimeSyncWait 60
64bitInterfaceCounters 1
DatabaseWriteAheadLogging 0
DatabaseSynchronous 2
UseUTC 0
MonthRotate 1
VacuumOnStartup 0
VacuumOnHUPSignal 0
5MinuteHours 0
HourlyDays 2
DailyDays 62
MonthlyMonths 25
YearlyYears -1
TopDayEntries 0
CreateDirs 1
UseLogging 2
